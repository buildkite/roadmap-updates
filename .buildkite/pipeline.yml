# Buildkite Roadmap Updates Demo Pipeline
# A walkthrough of six major Buildkite features — designed to be read like a presentation.
# Each group runs sequentially so the build tells a story from top to bottom.

env:
  DEMO_PIPELINE: "true"

steps:
  # ──────────────────────────────────────────────
  # 🤖 Feature 1: AI / Agentic Workflows
  # ──────────────────────────────────────────────
  - group: ":robot_face: Feature 1 — AI / Agentic Workflows"
    key: "ai-workflows"
    steps:
      - label: ":buildkite: 1a. Model Providers"
        key: "model-providers"
        command: scripts/01-model-providers.sh

      - label: ":pipeline: 1b. Dynamic Pipeline Upload"
        key: "dynamic-pipeline"
        command: scripts/02-dynamic-pipeline.sh

      - label: ":claude: 1c. Claude Build Summary"
        key: "claude-summary"
        command: "echo '🤖 This step demonstrates the Claude Summarize plugin analyzing a build and creating an annotation.'"
        plugins:
          - buildkite-plugins/claude-summarize#v1.1.0:
              api_key: "$$ANTHROPIC_API_KEY"
              trigger: "always"
              custom_prompt: "This is a Buildkite demo pipeline. Provide a brief, helpful summary of what happened in this build step. Mention that this annotation was auto-generated by the Claude Summarize Buildkite plugin."

  # ──────────────────────────────────────────────
  # 🧪 Feature 2: Test Engine Workflows
  # ──────────────────────────────────────────────
  - group: ":test_tube: Feature 2 — Test Engine Workflows"
    key: "test-engine"
    depends_on: "ai-workflows"
    steps:
      - label: ":jest: 2a. Parallel Tests with bktec"
        key: "test-run"
        command: scripts/03-test-engine.sh
        parallelism: 3

      - label: ":bar_chart: 2b. Monitors & Actions"
        key: "test-workflows"
        depends_on: "test-run"
        command: scripts/04-test-engine-workflows.sh

  # ──────────────────────────────────────────────
  # 🔌 Feature 3: MCP Server
  # ──────────────────────────────────────────────
  - group: ":electric_plug: Feature 3 — MCP Server"
    key: "mcp-server"
    depends_on: "test-engine"
    steps:
      - label: ":plug: 3. MCP Server"
        key: "mcp-overview"
        command: scripts/05-mcp-server.sh

  # ──────────────────────────────────────────────
  # 🔀 Feature 4: GitHub Merge Queue
  # ──────────────────────────────────────────────
  - group: ":merged: Feature 4 — GitHub Merge Queue"
    key: "merge-queue"
    depends_on: "mcp-server"
    steps:
      - label: ":mag: 4a. Merge Queue Detection"
        key: "merge-queue-detect"
        command: scripts/06-merge-queue.sh

      - label: ":white_check_mark: 4b. Conditional Step (merge queue only)"
        key: "merge-queue-only"
        if: build.merge_queue.base_commit != null
        command: |
          echo "✅ This step ONLY runs inside a GitHub merge queue build!"
          echo "Base branch: $BUILDKITE_MERGE_QUEUE_BASE_BRANCH"
          echo "Base commit: $BUILDKITE_MERGE_QUEUE_BASE_COMMIT"

  # ──────────────────────────────────────────────
  # 🔐 Feature 5: Secrets & Access Controls
  # ──────────────────────────────────────────────
  - group: ":lock: Feature 5 — Secrets & Access Controls"
    key: "secrets"
    depends_on: "merge-queue"
    steps:
      - label: ":key: 5a. Secrets YAML Integration"
        key: "secrets-yaml"
        command: scripts/07-secrets-demo.sh
        secrets:
          - DEMO_SECRET

      - label: ":closed_lock_with_key: 5b. Custom Env Var Mapping"
        key: "secrets-custom"
        command: scripts/08-secrets-custom.sh
        secrets:
          MY_APP_TOKEN: DEMO_SECRET

      - label: ":shield: 5c. Access Policies"
        key: "secrets-policies"
        command: scripts/09-secrets-policies.sh

  # ──────────────────────────────────────────────
  # 🔄 Feature 6: Retry Agent Affinity
  # ──────────────────────────────────────────────
  - group: ":repeat: Feature 6 — Retry Agent Affinity"
    key: "retry-affinity"
    depends_on: "secrets"
    steps:
      - label: ":arrows_counterclockwise: 6. Retry & Agent Affinity"
        key: "retry-demo"
        command: scripts/10-retry-affinity.sh
        retry:
          automatic:
            - exit_status: "*"
              limit: 2
