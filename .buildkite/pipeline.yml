# Buildkite Roadmap Updates Demo Pipeline
# Demonstrates six major Buildkite features shipped in late 2025 / early 2026.
# See README.md for full documentation and links to each feature.

env:
  DEMO_PIPELINE: "true"

steps:
  # ──────────────────────────────────────────────
  # 🤖 AI / Agentic Workflows
  # ──────────────────────────────────────────────
  - group: ":robot_face: AI / Agentic Workflows"
    key: "ai-workflows"
    steps:
      - label: ":buildkite: Model Providers"
        key: "model-providers"
        command: scripts/model-providers.sh

      - label: ":pipeline: Dynamic Pipeline Upload"
        key: "dynamic-pipeline"
        command: scripts/dynamic-pipeline.sh

      - label: ":claude: Claude Build Summary"
        key: "claude-summary"
        command: "echo 'Demo build step completed — Claude will summarize this output.'"
        plugins:
          - buildkite-plugins/claude-summarize-buildkite-plugin#v1.1.0:
              api_key: "$$ANTHROPIC_API_KEY"
              trigger: "always"
              custom_prompt: "This is a demo pipeline showcasing Buildkite features. Summarize what this build step did and mention that this annotation was generated by the Claude Summarize plugin."

  # ──────────────────────────────────────────────
  # 🧪 Test Engine Workflows
  # ──────────────────────────────────────────────
  - group: ":test_tube: Test Engine Workflows"
    key: "test-engine"
    steps:
      - label: ":jest: Run Tests (parallel)"
        key: "test-run"
        command: scripts/test-engine.sh
        parallelism: 3

      - label: ":bar_chart: Test Engine Workflows Overview"
        key: "test-workflows"
        command: scripts/test-engine-workflows.sh

  # ──────────────────────────────────────────────
  # 🔌 MCP Server
  # ──────────────────────────────────────────────
  - group: ":electric_plug: MCP Server"
    key: "mcp-server"
    steps:
      - label: ":robot_face: MCP Server Overview"
        key: "mcp-overview"
        command: scripts/mcp-server.sh

  # ──────────────────────────────────────────────
  # 🔀 GitHub Merge Queue
  # ──────────────────────────────────────────────
  - group: ":merged: GitHub Merge Queue"
    key: "merge-queue"
    steps:
      - label: ":mag: Merge Queue Detection"
        key: "merge-queue-detect"
        command: scripts/merge-queue.sh

      - label: ":white_check_mark: Merge Queue Only Step"
        key: "merge-queue-only"
        if: build.merge_queue.base_commit != null
        command: |
          echo "✅ This step ONLY runs inside a GitHub merge queue build!"
          echo "Base branch: $BUILDKITE_MERGE_QUEUE_BASE_BRANCH"
          echo "Base commit: $BUILDKITE_MERGE_QUEUE_BASE_COMMIT"
          buildkite-agent annotate "This step executed because this is a merge queue build. Base branch: \`$BUILDKITE_MERGE_QUEUE_BASE_BRANCH\`" --style success --context merge-queue-only

  # ──────────────────────────────────────────────
  # 🔐 Secrets & Access Controls
  # ──────────────────────────────────────────────
  - group: ":lock: Secrets & Access Controls"
    key: "secrets"
    steps:
      - label: ":key: Secrets YAML Integration"
        key: "secrets-yaml"
        command: scripts/secrets-demo.sh
        secrets:
          - DEMO_SECRET

      - label: ":closed_lock_with_key: Secrets Custom Mapping"
        key: "secrets-custom"
        command: scripts/secrets-custom.sh
        secrets:
          MY_APP_TOKEN: DEMO_SECRET

      - label: ":shield: Access Policies Explained"
        key: "secrets-policies"
        command: scripts/secrets-policies.sh

  # ──────────────────────────────────────────────
  # 🔄 Retry Agent Affinity
  # ──────────────────────────────────────────────
  - group: ":repeat: Retry Agent Affinity"
    key: "retry-affinity"
    steps:
      - label: ":arrows_counterclockwise: Retry with Agent Affinity"
        key: "retry-demo"
        command: scripts/retry-affinity.sh
        retry:
          automatic:
            - exit_status: "*"
              limit: 2
